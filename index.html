<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Paper Box Instant Quote</title>
<style>
body { font-family: Arial; background:#f5f5f5; }
.container { width:450px; margin:30px auto; padding:20px; background:#fff; border-radius:10px; }
button { padding:8px 12px; margin:5px; cursor:pointer; }
button.selected { background:#4CAF50; color:white; }
.box-btn img { width:120px; height:80px; object-fit:cover; border:2px solid #ccc; border-radius:6px; }
.box-btn.selected img { border-color:#4CAF50; }
.result { margin-top:15px; font-size:18px; font-weight:bold; }
.hidden { display:none; }
input { width:100%; padding:8px; margin:5px 0; font-size:16px; }
</style>
</head>
<body>

<!-- Step 1: Select Box Type -->
<div class="container" id="step1">
<h2>Select Box Type</h2>
<div id="boxButtons">
  <button class="box-btn" onclick="selectBox('RSC','rsc.jpg')"><img src="rsc.jpg"><br>RSC Box</button>
  <button class="box-btn" onclick="selectBox('5Panel','5panel.jpg')"><img src="5panel.jpg"><br>5 Panel Box</button>
  <button class="box-btn" onclick="selectBox('Pizza','pizza.jpg')"><img src="pizza.jpg"><br>Pizza Box</button>
  <button class="box-btn" onclick="selectBox('Gift','gift.jpg')"><img src="gift.jpg"><br>Gift Box</button>
</div>
</div>

<!-- Step 2: Enter Box Details -->
<div class="container hidden" id="step2">
<h2>Enter Box Details</h2>
<p id="selectedBox"></p>
<img id="boxImage" src="" style="width:200px;height:auto;margin-bottom:10px;"></img>

<br>
Length L (mm)
<input type="number" id="L">

Width W (mm)
<input type="number" id="W">

Height H (mm)
<input type="number" id="H">

Quantity
<input type="number" id="qty">

<!-- Layer selection buttons -->
<p>Select Layer:</p>
<div id="layerButtons"></div>

<!-- Material buttons container -->
<div id="materialContainer" class="hidden">
<p>Select Material:</p>
<div id="materialButtons"></div>
</div>

<div class="result" id="result"></div>
<button onclick="goBack()">Change Box Type</button>
</div>

<script>
let selectedBoxType = "";
let selectedLayer = "";
let selectedMaterialFactor = 0;

// Material mapping
const materialOptions = {
    "3": [
        {name:"60 LBS", factor:1.5*1.2},
        {name:"100 LBS", factor:1.8*1.2},
        {name:"150 LBS", factor:2.5*1.2}
    ],
    "5": [
        {name:"100 LBS", factor:2.3*1.2},
        {name:"150 LBS", factor:2.7*1.2},
        {name:"200 LBS", factor:3.1*1.2}
    ]
};

// Box selection
function selectBox(boxType, imgSrc){
    selectedBoxType = boxType;
    document.querySelectorAll(".box-btn").forEach(b=>b.classList.remove("selected"));
    event.target.classList.add("selected");
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    document.getElementById("selectedBox").innerText = "Selected Box: " + boxType;
    document.getElementById("boxImage").src = imgSrc;

    // Show layer buttons
    const layerDiv = document.getElementById("layerButtons");
    layerDiv.innerHTML = "";
    if(boxType === "Pizza" || boxType === "Gift"){
        // Only 3 Layer
        const btn = document.createElement("button");
        btn.innerText = "3 Layer";
        btn.className = "layer-btn";
        btn.onclick = ()=>selectLayer('3');
        layerDiv.appendChild(btn);
    } else {
        // Show 3 Layer and 5 Layer
        ['3','5'].forEach(l=>{
            const btn = document.createElement("button");
            btn.innerText = l + " Layer";
            btn.className = "layer-btn";
            btn.onclick = ()=>selectLayer(l);
            layerDiv.appendChild(btn);
        });
    }

    document.getElementById("materialContainer").classList.add("hidden");
    document.getElementById("materialButtons").innerHTML = "";
    document.getElementById("result").innerHTML = "";
    selectedLayer = "";
    selectedMaterialFactor = 0;
}

// Go back
function goBack(){
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step1").classList.remove("hidden");
}

// Select Layer
function selectLayer(layer){
    selectedLayer = layer;
    document.querySelectorAll(".layer-btn").forEach(b=>b.classList.remove("selected"));
    event.target.classList.add("selected");

    // Show material buttons
    const container = document.getElementById("materialButtons");
    container.innerHTML = "";
    materialOptions[layer].forEach(opt=>{
        const btn = document.createElement("button");
        btn.innerText = opt.name;
        btn.className = "material-btn";
        btn.onclick = ()=>selectMaterial(opt.factor, btn);
        container.appendChild(btn);
    });
    document.getElementById("materialContainer").classList.remove("hidden");
}

// Select Material
function selectMaterial(factor, btnElement){
    selectedMaterialFactor = factor;
    document.querySelectorAll(".material-btn").forEach(b=>b.classList.remove("selected"));
    btnElement.classList.add("selected");

    calc();
}

// Calculation
function calc(){
    let L = parseFloat(document.getElementById("L").value);
    let W = parseFloat(document.getElementById("W").value);
    let H = parseFloat(document.getElementById("H").value);
    let qty = parseFloat(document.getElementById("qty").value);
    if(!L || !W || !H || !qty || !selectedMaterialFactor) return;

    let area;
    if(selectedBoxType === "RSC") area = ((40+2*L+2*W)/1000)*((W+H+50)/1000);
    else if(selectedBoxType === "5Panel") area = ((2*W+3*H)/1000)*((L+2*H+50)/1000);
    else if(selectedBoxType === "Pizza") area = (((H*3)+(W*2)+60)/1000)*(((L+32)+((H*2)+20+((H+3)*2)+12)+50)/1000);
    else if(selectedBoxType === "Gift") area = ((L*2+W*2+20+30)/1000)*((W+H+20+(W/2+20+30))/1000);

    area *= selectedMaterialFactor;

    let price = Math.min(area*2.2, area+5);
    price = Math.ceil(price/0.05)*0.05;
    let total = price*qty;

    document.getElementById("result").innerHTML =
        "Unit Price: RM " + price.toFixed(2) +
        "<br>Total: RM " + total.toFixed(2) + " (Not including delivery)" +
        "<br>Processing Time: 5~7 working days" +
        "<br>Material: " + selectedLayer + " Layer" + " , " + selectedMaterialFactor + " LBS";
}
</script>

</body>
</html>

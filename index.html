<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Box Instant Quote</title>

<style>
body { font-family: Arial; background:#f5f5f5; }
.container { width:460px; margin:30px auto; padding:20px; background:#fff; border-radius:10px; }

button { padding:8px 12px; margin:5px; cursor:pointer; border-radius:6px; border:1px solid #ccc; }
button.selected { background:#4CAF50; color:white; }

.box-btn img { width:120px; height:80px; object-fit:cover; border:2px solid #ccc; border-radius:6px; }
.box-btn.selected img { border-color:#4CAF50; }

.result { margin-top:15px; font-size:18px; font-weight:bold; }
.hidden { display:none; }
input { width:100%; padding:8px; margin:5px 0; font-size:16px; }

</style>
</head>

<body>

<!-- STEP 1 -->
<div class="container" id="step1">
<h2>Select Box Type</h2>

<button class="box-btn" onclick="selectBox('RSC','rsc.jpg')">
<img src="rsc.jpg"><br>RSC Box
</button>

<button class="box-btn" onclick="selectBox('5Panel','5panel.jpg')">
<img src="5panel.jpg"><br>5 Panel Box
</button>

<button class="box-btn" onclick="selectBox('Pizza','pizza.jpg')">
<img src="pizza.jpg"><br>Pizza Box
</button>

<button class="box-btn" onclick="selectBox('Gift','gift.jpg')">
<img src="gift.jpg"><br>Gift Box
</button>

</div>


<!-- STEP 2 -->
<div class="container hidden" id="step2">

<h2>Enter Box Details</h2>

<p id="selectedBox"></p>
<img id="boxImage" style="width:200px;margin-bottom:10px;">
<br>
Length L (mm)
<input type="number" id="L">

Width W (mm)
<input type="number" id="W">

Height H (mm)
<input type="number" id="H">

Quantity
<input type="number" id="qty">


<p>Select Layer:</p>
<div id="layerButtons"></div>

<div id="materialContainer" class="hidden">
<p>Select Material:</p>
<div id="materialButtons"></div>
</div>

<div class="result" id="result"></div>

<button onclick="goBack()">Change Box Type</button>

</div>


<script>

// ===== GLOBAL VARIABLES =====

let selectedBoxType = "";
let selectedLayer = "";
let selectedMaterial = null;


// ===== MATERIAL DATA =====

const materialOptions = {

    "3": [
        {name:"60 LBS", factor:1.5*1.2},
        {name:"100 LBS", factor:1.8*1.2},
        {name:"150 LBS", factor:2.5*1.2}
    ],

    "5": [
        {name:"100 LBS", factor:2.3*1.2},
        {name:"150 LBS", factor:2.7*1.2},
        {name:"200 LBS", factor:3.1*1.2}
    ]

};


// ===== SELECT BOX TYPE =====

function selectBox(boxType, imgSrc){

    selectedBoxType = boxType;

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");

    document.getElementById("selectedBox").innerText =
        "Selected Box: " + boxType;

    document.getElementById("boxImage").src = imgSrc;


    const layerDiv = document.getElementById("layerButtons");
    layerDiv.innerHTML = "";


    // Pizza & Gift only 3 Layer
    if(boxType === "Pizza" || boxType === "Gift"){

        createLayerButton("3");

    }else{

        createLayerButton("3");
        createLayerButton("5");

    }

    resetMaterial();

}


// ===== CREATE LAYER BUTTON =====

function createLayerButton(layer){

    const btn = document.createElement("button");

    btn.innerText = layer + " Layer";

    btn.onclick = ()=>selectLayer(layer, btn);

    btn.className = "layer-btn";

    document.getElementById("layerButtons").appendChild(btn);

}


// ===== SELECT LAYER =====

function selectLayer(layer, btn){

    selectedLayer = layer;

    document.querySelectorAll(".layer-btn")
        .forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");


    const container = document.getElementById("materialButtons");
    container.innerHTML = "";


    materialOptions[layer].forEach(opt=>{

        const mbtn = document.createElement("button");

        mbtn.innerText = opt.name;

        mbtn.className = "material-btn";

        mbtn.onclick = ()=>selectMaterial(opt, mbtn);

        container.appendChild(mbtn);

    });

    document.getElementById("materialContainer")
        .classList.remove("hidden");

}


// ===== SELECT MATERIAL =====

function selectMaterial(materialObj, btn){

    selectedMaterial = materialObj;

    document.querySelectorAll(".material-btn")
        .forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    calc();

}


// ===== CALCULATION =====

function calc(){

    let L = parseFloat(document.getElementById("L").value);
    let W = parseFloat(document.getElementById("W").value);
    let H = parseFloat(document.getElementById("H").value);
    let qty = parseFloat(document.getElementById("qty").value);

    if(!L || !W || !H || !qty || !selectedMaterial) return;


    let area;


    if(selectedBoxType === "RSC")
        area = ((40+2*L+2*W)/1000)*((W+H+50)/1000);

    else if(selectedBoxType === "5Panel")
        area = ((2*W+3*H)/1000)*((L+2*H+50)/1000);

    else if(selectedBoxType === "Pizza")
        area = (((H*3)+(W*2)+60)/1000)*
               (((L+32)+((H*2)+20+((H+3)*2)+12)+50)/1000);

    else if(selectedBoxType === "Gift")
        area = ((L*2+W*2+20+30)/1000)*
               ((W+H+20+(W/2+20+30))/1000);


    area *= selectedMaterial.factor;


    let price = Math.min(area*2.2, area+5);
    price = Math.ceil(price/0.05)*0.05;

    let total = price * qty;


    document.getElementById("result").innerHTML =

        "Box Type: " + selectedBoxType +
        "<br>Unit Price: RM " + price.toFixed(2) +
        "<br>Total: RM " + total.toFixed(2) + " (Not including delivery)" +
        "<br>Processing Time: 5~7 working days" +
        "<br>Material: " + selectedLayer + " Layer , " + selectedMaterial.name;

}


// ===== RESET MATERIAL =====

function resetMaterial(){

    document.getElementById("materialContainer")
        .classList.add("hidden");

    document.getElementById("materialButtons")
        .innerHTML = "";

    selectedMaterial = null;

}


// ===== GO BACK =====

function goBack(){

    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step1").classList.remove("hidden");

}

</script>

</body>
</html>
